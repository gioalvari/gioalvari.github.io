<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px;
    background:#0e1012;
    color:#d9dde2;
    font-family:"Inter",sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 88px;
    position:relative; overflow:hidden;
  }
  body::after{
    content:""; position:absolute; right:-180px; top:-180px;
    width:620px; height:620px; border-radius:50%;
    background:radial-gradient(circle,rgba(29,58,122,.5) 0%,transparent 70%);
  }
  .glow{
    position:absolute; right:-200px; top:-220px;
    width:700px; height:700px; border-radius:50%;
    background:radial-gradient(circle,rgba(127,178,255,.16) 0%,rgba(127,178,255,0) 68%);
  }
  .eyebrow{
    font-family:ui-monospace,monospace; font-size:19px; letter-spacing:.14em;
    text-transform:uppercase; color:#7fb2ff; margin-bottom:34px;
  }
  h1{
    font-family:"Fraunces",serif; font-weight:600; font-size:76px;
    line-height:1.06; letter-spacing:-.02em; max-width:940px;
  }
  p{ margin-top:34px; font-size:27px; color:#8b939c; max-width:840px; line-height:1.45; }
  .foot{
    position:absolute; left:88px; bottom:60px;
    font-family:ui-monospace,monospace; font-size:20px; color:#8b939c;
    display:flex; gap:26px; align-items:center;
  }
  .dot{ width:6px;height:6px;border-radius:50%;background:#38507a; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="eyebrow">Giordano Alvari · Senior AI Engineer</div>
  <h1>I build LLM systems that survive contact with production.</h1>
  <p>LLM agents in production across two countries · forecasting programmes executives plan against</p>
  <div class="foot">
    <span>gioalvari.github.io</span><span class="dot"></span>
    <span>Florence, Italy</span>
  </div>
</body>
</html>
