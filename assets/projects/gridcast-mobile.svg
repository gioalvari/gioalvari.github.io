<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">GridCast probabilistic energy forecast</title>
  <desc id="desc">Energy demand forecast with a calibrated uncertainty interval and 80.04 percent holdout coverage.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10171c"/><stop offset="1" stop-color="#172a2c"/></linearGradient><linearGradient id="band" x2="0" y2="1"><stop stop-color="#66d4c2" stop-opacity=".5"/><stop offset="1" stop-color="#66d4c2" stop-opacity=".05"/></linearGradient></defs>
  <rect width="600" height="360" rx="20" fill="url(#bg)"/>
  <text x="30" y="42" fill="#66d4c2" font-family="ui-monospace, monospace" font-size="18" letter-spacing="2">GRIDCAST</text>
  <text x="30" y="78" fill="#f0f4f3" font-family="Georgia, serif" font-size="25">Calibrated energy forecasts</text>
  <path d="M30 235C80 180 110 190 160 215S240 290 290 235S360 135 410 190S490 285 570 205L570 290C500 330 455 260 410 250S340 300 290 290S210 330 160 280S85 275 30 305Z" fill="url(#band)"/>
  <path d="M30 268C80 218 112 225 160 246S240 304 290 263S360 185 410 226S495 303 570 250" fill="none" stroke="#66d4c2" stroke-width="5" stroke-linecap="round"/>
  <path d="M30 250C80 195 115 245 160 222S235 320 290 240S360 170 410 245S500 275 570 225" fill="none" stroke="#f7b955" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9"/>
  <rect x="422" y="28" width="148" height="66" rx="10" fill="#66d4c2" opacity=".12" stroke="#66d4c2"/>
  <text x="496" y="53" fill="#a9b6b5" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">UNCERTAINTY</text>
  <text x="496" y="80" fill="#f0f4f3" font-family="Georgia, serif" font-size="22" text-anchor="middle">calibrated</text>
</svg>
