<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent Memory Layer request pipeline</title>
  <desc id="desc">An agent request passes through a transparent local memory proxy that embeds, retrieves, injects context and forwards to a language model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171318"/><stop offset="1" stop-color="#2d202b"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ec8dc5"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="70" y="72" fill="#f19dce" font-size="20" letter-spacing="3">AGENT MEMORY LAYER / C++17</text>
    <text x="70" y="122" fill="#fff2fa" font-family="Georgia, serif" font-size="36">Memory without changing the agent</text>
  </g>
  <g fill="#211a21" stroke="#65495c" stroke-width="2">
    <rect x="70" y="260" width="190" height="110" rx="16"/><rect x="940" y="260" width="190" height="110" rx="16"/>
  </g>
  <g fill="#fff2fa" font-family="ui-monospace, monospace" font-size="20" text-anchor="middle">
    <text x="165" y="310">YOUR AGENT</text><text x="165" y="340" fill="#ad8d9f" font-size="14">OpenAI client</text>
    <text x="1035" y="310">LLM BACKEND</text><text x="1035" y="340" fill="#ad8d9f" font-size="14">unchanged</text>
  </g>
  <path d="M260 315H345M855 315H940" stroke="#ec8dc5" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="345" y="185" width="510" height="315" rx="24" fill="#2a1f29" stroke="#ec8dc5" stroke-width="3"/>
  <text x="600" y="230" fill="#fff2fa" font-family="Georgia, serif" font-size="29" text-anchor="middle">Transparent memory proxy</text>
  <g font-family="ui-monospace, monospace" font-size="16">
    <rect x="390" y="270" width="180" height="70" rx="12" fill="#3a2937"/><text x="480" y="312" fill="#f19dce" text-anchor="middle">1 · EMBED</text>
    <rect x="630" y="270" width="180" height="70" rx="12" fill="#3a2937"/><text x="720" y="312" fill="#f19dce" text-anchor="middle">2 · SEARCH</text>
    <rect x="390" y="380" width="180" height="70" rx="12" fill="#3a2937"/><text x="480" y="422" fill="#f19dce" text-anchor="middle">3 · INJECT</text>
    <rect x="630" y="380" width="180" height="70" rx="12" fill="#3a2937"/><text x="720" y="422" fill="#f19dce" text-anchor="middle">4 · CAPTURE</text>
  </g>
  <g fill="none" stroke="#ad6b92" stroke-width="2" marker-end="url(#arrow)">
    <path d="M570 305H630"/><path d="M720 340V380"/><path d="M630 415H570"/><path d="M480 380V340"/>
  </g>
  <rect x="345" y="555" width="510" height="90" rx="16" fill="#211a21" stroke="#65495c" stroke-width="2"/>
  <text x="600" y="592" fill="#fff2fa" font-family="ui-monospace, monospace" font-size="18" text-anchor="middle">SQLITE + LOCAL EMBEDDINGS</text>
  <text x="600" y="621" fill="#ad8d9f" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">namespaces · temporal decay · deduplication</text>
  <path d="M600 500V555" stroke="#ec8dc5" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="930" y="56" width="200" height="72" rx="12" fill="#ec8dc5" opacity=".1" stroke="#ec8dc5" stroke-opacity=".35"/>
  <text x="950" y="84" fill="#ad8d9f" font-family="ui-monospace, monospace" font-size="14">LOCAL-FIRST</text>
  <text x="950" y="111" fill="#fff2fa" font-family="ui-monospace, monospace" font-size="21" font-weight="700">zero cloud calls</text>
</svg>
